apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-worker
  namespace: devtrack
  labels:
    app: playwright-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-worker
  template:
    metadata:
      labels:
        app: playwright-worker
    spec:
      containers:
      - name: playwright-worker
        image: swp391-su26-ai-audit-project-swp391_se20a11_group-04-1-playwright-worker:v2
        imagePullPolicy: Never
        envFrom:
        - secretRef:
            name: devtrack-secrets
        env:
        # ⚠️  VPS DEV — dùng IP VPS thật để K8s pod (kind trên Linux) gọi ra Docker host
        # File này deploy lên VPS 160.191.51.68. Nếu đổi VPS thì cập nhật IP bên dưới.
        - name: KAFKA_BROKERS
          value: "160.191.51.68:9094"
        - name: WS_URL
          value: "ws://160.191.51.68:4001"
        - name: BACKEND_URL
          value: "http://160.191.51.68:8080"
        - name: REDIS_HOST
          value: "160.191.51.68"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
