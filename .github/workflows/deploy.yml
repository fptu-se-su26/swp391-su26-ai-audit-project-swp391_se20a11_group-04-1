name: DevTrack CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "=========================================="
            echo "   BẮT ĐẦU TRIỂN KHAI CODE MỚI TRÊN VPS   "
            echo "=========================================="

            REPO_DIR=~/swp391-su26-ai-audit-project-swp391_se20a11_group-04-1

            # 1. Đồng bộ code từ GitHub
            cd "${REPO_DIR}"
            git fetch origin develop
            git reset --hard origin/develop

            # 2. Deploy Backend (Spring Boot)
            echo ">> Rebuilding Backend (Spring Boot)..."
            cd "${REPO_DIR}/code/backend"

            lsof -t -i:8080 | xargs -r kill -9 || true
            sleep 2

            chmod +x mvnw
            export MAVEN_OPTS="-Xmx512m -XX:MaxMetaspaceSize=256m"
            ./mvnw clean package -Dmaven.test.skip=true

            # Spring Boot start — load env vars từ .env file trước khi chạy
            set -a && source "${REPO_DIR}/.env" && set +a
            nohup java -Xmx512m \
              -Dspring.profiles.active=docker \
              -Dspring.kafka.bootstrap-servers=localhost:9092 \
              -jar target/backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
            echo "   Backend PID: $!"
            echo "   Backend deployed OK"

            # 3. Deploy Frontend (Vite)
            echo ">> Restarting Frontend (Vite)..."
            cd "${REPO_DIR}/code/frontend"

            lsof -t -i:5173 | xargs -r kill -9 || true

            npm install
            nohup npm run dev -- --host 0.0.0.0 --port 5173 > frontend.log 2>&1 &
            echo "   Frontend deployed OK"

            # 4. Rebuild playwright-server với code mới (templateEngine.js)
            echo ">> Rebuilding playwright-server..."
            cd "${REPO_DIR}"
            docker compose -f docker-compose.dev.yml -f docker-compose.override.yml build playwright-server
            docker compose -f docker-compose.dev.yml -f docker-compose.override.yml up -d --no-deps playwright-server

            # 5. Rebuild architecture-parser với code mới (selector_scan_service.py)
            echo ">> Rebuilding architecture-parser..."
            docker compose -f docker-compose.dev.yml -f docker-compose.override.yml build architecture-parser
            docker compose -f docker-compose.dev.yml -f docker-compose.override.yml up -d --no-deps --force-recreate architecture-parser

            # 6. Đảm bảo các infra container luôn chạy
            echo ">> Checking Infra Containers..."
            docker compose -f docker-compose.dev.yml -f docker-compose.override.yml up -d kafka postgres redis mongodb

            echo "=========================================="
            echo "        TRIỂN KHAI HOÀN TẤT THÀNH CÔNG!   "
            echo "=========================================="
