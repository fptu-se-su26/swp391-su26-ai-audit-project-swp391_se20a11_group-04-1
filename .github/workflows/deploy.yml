name: DevTrack CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 10m
          command_timeout: 30m
          script: |
            echo "=========================================="
            echo "   BẮT ĐẦU TRIỂN KHAI CODE MỚI TRÊN VPS   "
            echo "=========================================="

            REPO_DIR=~/swp391-su26-ai-audit-project-swp391_se20a11_group-04-1

            # 1. Đồng bộ code từ GitHub
            cd "${REPO_DIR}"
            git fetch origin develop
            git reset --hard origin/develop

            # 1b. Cập nhật Nginx config nếu có thay đổi
            echo ">> Syncing Nginx config..."
            sudo cp "${REPO_DIR}/code/nginx/devtrack.conf" /etc/nginx/sites-available/devtrack
            sudo ln -sf /etc/nginx/sites-available/devtrack /etc/nginx/sites-enabled/devtrack
            sudo nginx -t && sudo systemctl reload nginx
            echo "   Nginx reloaded OK"

            # 2. Đảm bảo infra containers up TRƯỚC khi build/start backend
            echo ">> Ensuring Infra Containers (postgres, redis, mongodb, kafka) are UP..."
            cd "${REPO_DIR}"
            docker compose -f docker-compose.dev.yml up -d postgres redis mongodb kafka
            # Chờ postgres thực sự accept connections (tối đa 30 giây)
            echo "   Waiting for PostgreSQL to be ready..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.dev.yml exec -T postgres pg_isready -U "${POSTGRES_USER:-devtrack}" > /dev/null 2>&1; then
                echo "   PostgreSQL ready after ${i}s"
                break
              fi
              sleep 1
            done
            # Chờ Kafka sẵn sàng (tối đa 30 giây) — tránh backend start trước Kafka
            echo "   Waiting for Kafka to be ready..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.dev.yml exec -T kafka \
                  /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1; then
                echo "   Kafka ready after ${i}s"
                break
              fi
              sleep 1
            done

            # 3. Deploy Backend (Spring Boot)
            echo ">> Rebuilding Backend (Spring Boot)..."
            cd "${REPO_DIR}/code/backend"

            # Kill existing backend và chờ port thực sự được giải phóng
            echo "   Killing existing backend on port 8080..."
            # Dùng lsof thay vì grep để tránh match chính SSH script
            PORT_PIDS=$(lsof -i:8080 -sTCP:LISTEN -t 2>/dev/null || true)
            if [ -n "$PORT_PIDS" ]; then
              kill -9 $PORT_PIDS 2>/dev/null || true
              sleep 3
            fi
            for i in $(seq 1 15); do
              if ! lsof -i:8080 -sTCP:LISTEN -t > /dev/null 2>&1; then
                echo "   Port 8080 is free after ${i}s"
                break
              fi
              sleep 1
            done

            chmod +x mvnw
            export MAVEN_OPTS="-Xmx512m -XX:MaxMetaspaceSize=256m"
            ./mvnw clean package -Dmaven.test.skip=true

            # Load env vars từ .env trước khi start
            set -a && source "${REPO_DIR}/.env" && set +a

            # Explicit truyền các biến DB vào JVM để tránh Spring dùng default sai
            nohup java -Xmx400m \
              -Dspring.profiles.active=docker \
              -Dspring.kafka.bootstrap-servers=localhost:9092 \
              -DDB_HOST="${DB_HOST:-localhost}" \
              -DDB_PORT="${DB_PORT:-5433}" \
              -DPOSTGRES_DB="${POSTGRES_DB:-dev_track_ai}" \
              -DPOSTGRES_USER="${POSTGRES_USER:-devtrack}" \
              -DPOSTGRES_PASSWORD="${POSTGRES_PASSWORD:-changeme}" \
              -DREDIS_HOST="${REDIS_HOST:-localhost}" \
              -DREDIS_PORT="${REDIS_PORT:-6379}" \
              -DMONGO_HOST="${MONGO_HOST:-localhost}" \
              -DMONGO_PORT="${MONGO_PORT:-27017}" \
              -jar target/backend-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
            BACKEND_PID=$!
            echo "   Backend PID: ${BACKEND_PID}"

            # Health check — chờ backend sẵn sàng (tối đa 90 giây)
            echo ">> Waiting for backend to be healthy..."
            HEALTH_OK=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/api/v1/auth/github/url > /dev/null 2>&1; then
                echo "   Backend health OK after $((i * 3))s"
                HEALTH_OK=true
                break
              fi
              echo "   Backend not ready yet ($i/30)..."
              sleep 3
            done

            if [ "${HEALTH_OK}" = "false" ]; then
              echo "ERROR: Backend failed to start after 90s. Last 100 lines of log:"
              tail -n 100 backend.log
              exit 1
            fi
            echo "   Backend deployed OK"

            # 4. Deploy Frontend (Vite - Static Build)
            echo ">> Building and Deploying Frontend (Vite)..."
            cd "${REPO_DIR}/code/frontend"

            # Dọn dẹp dev server cũ nếu có (để giải phóng RAM)
            lsof -t -i:5173 | xargs -r kill -9 || true

            npm install
            NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # Copy file build tĩnh sang thư mục web root của Nginx
            sudo mkdir -p /var/www/devtrack/html
            sudo cp -r dist/* /var/www/devtrack/html/
            echo "   Frontend built and deployed OK"

            # 5. Rebuild playwright-server với code mới (templateEngine.js)
            echo ">> Rebuilding playwright-server..."
            cd "${REPO_DIR}"
            docker compose -f docker-compose.dev.yml build playwright-server
            docker compose -f docker-compose.dev.yml up -d --no-deps --force-recreate playwright-server

            # 6. Rebuild architecture-parser với code mới (selector_scan_service.py)
            echo ">> Rebuilding architecture-parser..."
            docker compose -f docker-compose.dev.yml build architecture-parser
            docker compose -f docker-compose.dev.yml up -d --no-deps --force-recreate architecture-parser

            # 7. Apply Kubernetes manifests (playwright-worker + KEDA ScaledObject)
            # Luôn apply từ file local.yaml (đã config đúng IP VPS) để tránh config drift
            echo ">> Applying Kubernetes manifests..."

            # 7a. Rebuild playwright-worker image với code mới nhất
            cd "${REPO_DIR}"
            docker build -f code/playwright-service/Dockerfile.worker \
              -t swp391-su26-ai-audit-project-swp391_se20a11_group-04-1-playwright-worker:v2 \
              code/playwright-service/
            # Load image mới vào kind cluster (imagePullPolicy: Never cần image có sẵn trong containerd)
            kind load docker-image \
              swp391-su26-ai-audit-project-swp391_se20a11_group-04-1-playwright-worker:v2 \
              --name devtrack-local
            echo "   playwright-worker image rebuilt and loaded into kind"

            # 7b. Sync devtrack-secrets từ .env hiện tại — đảm bảo pod luôn có env vars mới nhất
            kubectl create secret generic devtrack-secrets \
              --from-env-file="${REPO_DIR}/.env" \
              -n devtrack --dry-run=client -o yaml | kubectl apply -f -
            echo "   devtrack-secrets synced from .env"

            # 7c. Apply deployment + scaler manifests
            kubectl apply -f "${REPO_DIR}/playwright-worker-local.yaml"
            kubectl apply -f "${REPO_DIR}/keda-scaledobject-local.yaml"

            # 7d. Ensure Kafka topic tồn tại (tránh mất topic sau khi Kafka container restart)
            echo ">> Ensuring Kafka topic exists..."
            docker compose -f docker-compose.dev.yml exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --create \
              --bootstrap-server localhost:9092 \
              --topic test-run-jobs \
              --partitions 10 \
              --replication-factor 1 \
              --if-not-exists
            echo "   Kafka topic OK"

            # 7e. Init consumer group offset về latest nếu group chưa có committed offset
            # Điều này tránh KEDA tính lag = 10 khi group mới tạo (offset = '-')
            echo ">> Initializing consumer group offset if needed..."
            LAG_UNKNOWN=$(docker compose -f docker-compose.dev.yml exec -T kafka \
              /opt/kafka/bin/kafka-consumer-groups.sh \
              --bootstrap-server localhost:9092 \
              --describe --group playwright-service-group 2>/dev/null | grep "test-run-jobs" | awk '{print $6}' | grep -c "^-$" || echo "0")
            if [ "${LAG_UNKNOWN:-0}" -gt 0 ]; then
              echo "   Detected ${LAG_UNKNOWN} partitions with uninitialized offset, resetting to latest..."
              # Scale down để group inactive, reset offset, scale lại
              kubectl scale deployment playwright-worker -n devtrack --replicas=0
              sleep 70
              docker compose -f docker-compose.dev.yml exec -T kafka \
                /opt/kafka/bin/kafka-consumer-groups.sh \
                --bootstrap-server localhost:9092 \
                --group playwright-service-group \
                --topic test-run-jobs \
                --reset-offsets --to-latest --execute 2>/dev/null || true
              echo "   Consumer group offset initialized"
            else
              echo "   Consumer group offset already initialized, skipping"
            fi

            # Rollout restart để pod lấy image mới + env vars mới nhất
            kubectl rollout restart deployment/playwright-worker -n devtrack
            kubectl rollout status deployment/playwright-worker -n devtrack --timeout=120s
            echo "   Kubernetes manifests applied OK"

            echo "=========================================="
            echo "        TRIỂN KHAI HOÀN TẤT THÀNH CÔNG!   "
            echo "=========================================="
