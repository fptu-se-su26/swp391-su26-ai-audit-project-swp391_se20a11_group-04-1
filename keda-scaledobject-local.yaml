apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: playwright-worker-scaler
  namespace: devtrack
  labels:
    app: playwright-worker
spec:
  scaleTargetRef:
    name: playwright-worker
  # Luôn giữ ít nhất 1 pod để tránh cold start khi có job mới
  minReplicaCount: 1
  # Tối đa 5 pod — giới hạn theo số partition Kafka (10) nhưng giữ conservative cho VPS
  maxReplicaCount: 5
  # pollingInterval và cooldownPeriod chỉ có tác dụng khi minReplicaCount = 0
  # Với minReplicaCount >= 1, scale-down được điều khiển bởi HPA behavior bên dưới
  pollingInterval: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60   # Chờ 60s lag = 0 liên tục mới scale down
          policies:
          - type: Pods
            value: 1                        # Giảm tối đa 1 pod mỗi 30s để tránh flapping
            periodSeconds: 30
        scaleUp:
          stabilizationWindowSeconds: 0    # Scale up ngay lập tức khi có lag
          policies:
          - type: Pods
            value: 2
            periodSeconds: 15
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: 160.191.51.68:9094
      consumerGroup: playwright-service-group
      topic: test-run-jobs
      lagThreshold: "1"
      # Chỉ bắt đầu scale khi lag >= 1 message thực sự
      # Tránh scale up khi offset = '-' (group mới, chưa có committed offset)
      activationLagThreshold: "1"
      offsetResetPolicy: latest
