server {
    server_name devtrack.dev www.devtrack.dev;

    # 1. Phục vụ file tĩnh cho Frontend (Vite Production Build)
    root /var/www/devtrack/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2a. SSE endpoint: AI Review streaming (3 phút timeout)
    location ~ ^/api/v1/projects/[^/]+/task-reviews/[^/]+/ai-stream$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';         # Bắt buộc cho SSE
        proxy_buffering off;                    # Bắt buộc cho SSE
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2b. SSE endpoint: Announcements streaming (1 giờ timeout)
    location ~ ^/api/v1/classrooms/[^/]+/announcements/stream$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2c. SSE endpoint: Mentor Verification streaming (1 giờ timeout)
    location /api/v1/mentor-verifications/stream {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2d. Điều hướng API thông thường về Backend (Spring Boot)
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Điều hướng kết nối WebSocket STOMP trực tiếp
    location /ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 4. Điều hướng kết nối WebSocket Notifications
    location /api/ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 5. Điều hướng kết nối WebSocket và API của Playwright Server
    location /playwright/ {
        proxy_pass http://localhost:4001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devtrack.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devtrack.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.devtrack.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = devtrack.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name devtrack.dev www.devtrack.dev;
    return 404; # managed by Certbot
}
