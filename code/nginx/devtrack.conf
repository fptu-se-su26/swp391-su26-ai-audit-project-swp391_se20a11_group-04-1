server {
    listen 80;
    server_name tenmiencuaban.com www.tenmiencuaban.com;

    # 1. Điều hướng yêu cầu thông thường tới Frontend (Vite)
    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 2a. SSE endpoint: AI Review streaming (3 phút timeout)
    location ~ ^/api/v1/projects/[^/]+/task-reviews/[^/]+/ai-stream$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';         # Bắt buộc cho SSE: bỏ header Connection
        proxy_buffering off;                    # Bắt buộc cho SSE: tắt buffering
        proxy_cache off;                        # Tắt cache cho stream
        proxy_read_timeout 300s;                # 5 phút (lớn hơn SseEmitter timeout 3 phút)
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;        # Vô hiệu hóa buffering ở cả Nginx và upstream
    }

    # 2b. SSE endpoint: Announcements streaming (1 giờ timeout)
    location ~ ^/api/v1/classrooms/[^/]+/announcements/stream$ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;               # Lớn hơn SseEmitter timeout 1 giờ
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2c. SSE endpoint: Mentor Verification streaming (1 giờ timeout)
    location /api/v1/mentor-verifications/stream {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 2d. Điều hướng API thông thường về Backend (Spring Boot)
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Điều hướng kết nối WebSocket STOMP trực tiếp
    location /ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 4. Điều hướng kết nối WebSocket Notifications
    location /api/ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # 5. Điều hướng kết nối WebSocket và API của Playwright Server
    location /playwright/ {
        proxy_pass http://localhost:4001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

