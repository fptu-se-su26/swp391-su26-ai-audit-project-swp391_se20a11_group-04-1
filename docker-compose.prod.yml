networks:
  devtrack-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  playwright-temp:
  ml-service-saved-models:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devtrack-net

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - devtrack-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devtrack-net

  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
    networks:
      - devtrack-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Override in .env when Ollama runs on a separate AI server.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ml-service-saved-models:/app/saved_models
    networks:
      - devtrack-net
    extra_hosts:
      # Makes host.docker.internal resolve on Linux Docker hosts as well.
      - "host.docker.internal:host-gateway"

  architecture-parser:
    build:
      context: ./code/architecture-parser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4002
      REDIS_URL: redis://redis:6379
      PARSE_TIMEOUT_SECONDS: ${PARSE_TIMEOUT_SECONDS:-300}
    depends_on:
      - redis
    networks:
      - devtrack-net

  playwright-server:
    build:
      context: ./code/playwright-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4001
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    ports:
      - "4001:4001"
    networks:
      - devtrack-net

  playwright-worker:
    build:
      context: ./code/playwright-service
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:29092
      BACKEND_URL: http://backend:8080
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      WS_URL: ws://playwright-server:4001
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      - backend
      - kafka
      - playwright-server
    networks:
      - devtrack-net

  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-devtrack_ai}?serverSelectionTimeoutMS=500
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      GITHUB_WEBHOOK_URL: ${GITHUB_WEBHOOK_URL}
      GITHUB_ENCRYPTION_KEY: ${GITHUB_ENCRYPTION_KEY}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_MONITORING_ADMIN_EMAIL: ${APP_MONITORING_ADMIN_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
      ML_SERVICE_URL: http://ml-service:8001
      PLAYWRIGHT_SERVICE_URL: http://playwright-server:4001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
      ml-service:
        condition: service_started
    networks:
      - devtrack-net

  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - devtrack-net
