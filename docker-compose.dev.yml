
networks:
  devtrack-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  playwright-temp:
  ollama-data:

services:

  # ─── 1. POSTGRESQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devtrack-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev_track_ai}
      POSTGRES_USER: ${POSTGRES_USER:-devtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - devtrack-net

  # ─── 2. MONGODB ──────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: devtrack-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - devtrack-net

  # ─── 3. REDIS ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devtrack-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - devtrack-net

  # ─── 3. KAFKA ────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: devtrack-kafka-dev
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,KIND_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092,KIND_HOST://host.docker.internal:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,KIND_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 10
    ports:
      - "9092:9092"
      - "9094:9094"
    networks:
      - devtrack-net

  # ─── 4. PLAYWRIGHT SERVER ────────────────────────────────
  playwright-server:
    build:
      context: ./code/playwright-service
      dockerfile: Dockerfile
    container_name: devtrack-playwright-server-dev
    restart: unless-stopped
    environment:
      PORT: 4001
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    ports:
      - "4001:4001"
    networks:
      - devtrack-net

  # ─── 5. PLAYWRIGHT WORKER ────────────────────────────────
  # Worker đã chuyển sang K8s. Xem playwright-worker-local.yaml
  # playwright-worker đã bị xóa khỏi docker-compose

  # ─── 6. ARCHITECTURE PARSER ──────────────────────────────
  architecture-parser:
    build:
      context: ./code/architecture-parser
      dockerfile: Dockerfile
    container_name: devtrack-architecture-parser-dev
    restart: unless-stopped
    environment:
      PORT: 4002
      REDIS_URL: redis://host.docker.internal:6379
      PARSE_TIMEOUT_SECONDS: 300
    ports:
      - "4002:4002"
    networks:
      - devtrack-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 7. ML SERVICE - disabled by default.
  # Start manually with: docker compose --profile ml up -d ml-service
  ml-service:
    profiles:
      - ml
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: devtrack-ml-service-dev
    restart: unless-stopped
    environment:
      PORT: 8000
      MODEL_PATH: ${ML_MODEL_PATH:-}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    networks:
      - devtrack-net

  # 8. OLLAMA - disabled by default.
  # Start manually with: docker compose --profile ollama up -d ollama
  ollama:
    profiles:
      - ollama
    image: ollama/ollama:latest
    container_name: devtrack-ollama-dev
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - devtrack-net
